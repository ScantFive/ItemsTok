name: Deploy CIAN proxy (Cloudflare Worker)

# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README).
on:
  push:
    branches: [main, claude/adoring-edison-1b6dw8]
    paths: ['worker/**', 'src/cian/**', 'src/types.ts', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, skipping worker deploy (see README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # A fresh Cloudflare account has no workers.dev subdomain, and wrangler can't create
      # one non-interactively. Register it via the API (free, no own domain needed).
      - name: Ensure workers.dev subdomain
        id: subdomain
        if: steps.creds.outputs.ok == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER: ${{ github.repository_owner }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          auth="Authorization: Bearer $CF_TOKEN"
          sub=$(curl -sS -H "$auth" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            base=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-\n' '-')
            for candidate in "$base" "$base-itemstok" "$base-itemstok-$RANDOM"; do
              resp=$(curl -sS -X PUT -H "$auth" -H 'Content-Type: application/json' \
                --data "{\"subdomain\":\"$candidate\"}" "$api")
              if [ "$(echo "$resp" | jq -r '.success')" = "true" ]; then
                sub="$candidate"
                echo "Registered $sub.workers.dev"
                break
              fi
              echo "Could not register $candidate: $(echo "$resp" | jq -c '.errors')"
            done
          fi
          if [ -z "$sub" ]; then
            echo "::error::Could not get a workers.dev subdomain. Register one at https://dash.cloudflare.com → Workers & Pages."
            exit 1
          fi
          echo "url=https://itemstok-cian.$sub.workers.dev" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
      - name: Check the proxy
        if: steps.creds.outputs.ok == 'true'
        env:
          URL: ${{ steps.subdomain.outputs.url }}
        run: |
          # A freshly deployed workers.dev route answers "error code: 1042" for a few minutes.
          for i in $(seq 1 20); do
            body=$(curl -sS --max-time 30 "$URL/search?region=1" || true)
            echo "$body" | jq -e . >/dev/null 2>&1 && break
            echo "Attempt $i: $(echo "$body" | head -c 100)"
            sleep 15
          done
          echo "Proxy answer: $(echo "$body" | head -c 400)"
          echo "Diagnostics (/debug):"
          curl -sS --max-time 60 "$URL/debug" | jq . || true
          {
            echo "### Прокси Циан: \`$URL\`"
            if echo "$body" | jq -e '.offers | length > 0' >/dev/null 2>&1; then
              echo "✅ Работает: получено $(echo "$body" | jq '.offers | length') объявлений."
              echo "Добавьте переменную репозитория \`CIAN_API_URL\` = \`$URL\` и перезапустите «Deploy to GitHub Pages»."
            else
              echo "⚠️ Прокси ответил без объявлений: \`$(echo "$body" | head -c 300)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
