name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to the gh-pages branch.
# Pages setting: Source "Deploy from a branch", branch "gh-pages", folder "/ (root)".
on:
  push:
    branches: [main, claude/adoring-edison-1b6dw8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Offers in public/data are exported from the owner's browser (`npm run import-data`).
      - run: npm run build
        env:
          VITE_CIAN_API: ${{ vars.CIAN_API_URL }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
